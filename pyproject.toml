[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kmradar"
version = "0.1.0"
description = "Радар поводов для клиентских менеджеров: MVP снаружи банка"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kmradar = "kmradar.cli:main"

[tool.setuptools]
packages = ["kmradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
